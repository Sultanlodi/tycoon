<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Poker</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" type="image/png" href="/static/favicon.png">
</head>
<body>
    <div id="app">

        <!-- Poker Home -->
        <div id="poker-home-screen" class="screen active">
            <div class="container">
                <button class="change-game-btn" onclick="goToPicker()">Change Game</button>
                <h1 class="logo poker-logo">POKER</h1>
                <p class="subtitle">Texas Hold'em</p>

                <div class="form-group">
                    <label>Your Name</label>
                    <input type="text" id="player-name" placeholder="Enter your name" maxlength="15" value="Player">
                </div>

                <div class="game-options">
                    <button class="game-btn create-btn poker-create-btn" onclick="pokerCreateRoom()">
                        <span class="btn-icon">[+]</span>
                        <span class="btn-title">Create Room</span>
                        <span class="btn-desc">Host a poker table (2-8 players)</span>
                    </button>

                    <button class="game-btn join-btn poker-join-btn" onclick="showPokerJoinModal()">
                        <span class="btn-icon">[>]</span>
                        <span class="btn-title">Join Room</span>
                        <span class="btn-desc">Enter a room code</span>
                    </button>

                    <button class="game-btn how-to-play-btn" onclick="showHowToPlayModal()">
                        <span class="btn-icon">[?]</span>
                        <span class="btn-title">How to Play</span>
                        <span class="btn-desc">Learn Texas Hold'em basics</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Poker Waiting Room / Lobby -->
        <div id="poker-waiting-screen" class="screen">
            <div class="container poker-lobby">
                <button class="change-game-btn" onclick="pokerLeaveGame()">Leave</button>
                <h2 class="poker-lobby-title">Poker Lobby</h2>

                <div class="room-code-display poker-room-code">
                    <span class="label">Room Code</span>
                    <span id="poker-room-code" class="code">------</span>
                    <button class="copy-btn" onclick="copyPokerRoomCode()">Copy</button>
                </div>

                <div class="players-list poker-players-list" id="poker-waiting-players"></div>

                <div id="poker-bot-controls" style="display:none;">
                    <button class="btn-secondary poker-add-bot-btn" onclick="pokerAddBot()">+ Add Bot</button>
                </div>

                <div id="poker-hand-results" class="poker-hand-results" style="display:none;"></div>

                <div id="poker-bankroll-info" class="poker-bankroll-info"></div>

                <div class="waiting-buttons">
                    <button class="btn-secondary" onclick="pokerLeaveGame()">Leave</button>
                    <button class="btn-primary" id="poker-start-btn" style="display: none;">Start Game</button>
                </div>
            </div>
        </div>

        <!-- Poker Game Screen -->
        <div id="poker-game-screen" class="screen">
            <div class="poker-table-header">
                <div class="poker-header-left">
                    <span id="poker-phase" class="poker-phase-label"></span>
                    <span id="poker-blinds-label" class="poker-blinds-label"></span>
                </div>
                <div class="poker-header-center">
                    <span id="poker-pot" class="poker-pot">Pot: $0</span>
                </div>
                <div class="poker-header-right">
                    <span id="poker-hand-num" class="poker-hand-num"></span>
                    <button class="hand-rankings-btn" onclick="showHandRankingsModal()" title="Hand Rankings">&#9824;</button>
                    <button class="leave-btn" onclick="pokerLeaveGame()">X</button>
                </div>
            </div>

            <div class="poker-felt">
                <!-- The Table (oval) -->
                <div class="poker-table-oval">
                    <!-- Seats rendered by JS around the table -->
                    <div class="poker-seats" id="poker-seats"></div>

                    <!-- Center of table: community cards + pot -->
                    <div class="poker-table-center">
                        <div class="poker-community" id="poker-community-cards"></div>
                        <div class="poker-pot-area" id="poker-pot-area">
                            <span id="poker-pot-center" class="poker-pot-center"></span>
                        </div>
                    </div>
                </div>

                <!-- Auto-deal countdown overlay -->
                <div id="poker-auto-deal" class="poker-auto-deal" style="display:none;">
                    <span>Next hand in <strong id="poker-deal-countdown">5</strong>s</span>
                </div>
            </div>

            <!-- Player's own area (bottom) -->
            <div class="poker-my-area">
                <div class="poker-my-info">
                    <span id="poker-my-name" class="poker-my-name"></span>
                    <span id="poker-my-stack">$0</span>
                    <span id="poker-my-bet"></span>
                </div>
                <div class="poker-my-hand" id="poker-my-hand"></div>

                <!-- Turn timer bar -->
                <div class="poker-timer-wrap" id="poker-timer-wrap" style="display:none;">
                    <div class="poker-timer-bar" id="poker-timer-bar"></div>
                </div>

                <!-- Actions -->
                <div class="poker-actions" id="poker-actions"></div>
            </div>

            <!-- Winner overlay -->
            <div id="poker-winner-overlay" class="poker-winner-overlay" style="display:none;">
                <div class="poker-winner-content" id="poker-winner-content"></div>
            </div>

            <!-- Reveal spotlight banner (queued, non-blocking) -->
            <div id="reveal-spotlight" class="reveal-spotlight"></div>
        </div>

        <!-- Shared Modal -->
        <div id="modal-overlay" class="modal-overlay" onclick="closeModal()">
            <div class="modal" onclick="event.stopPropagation()">
                <div id="modal-content"></div>
            </div>
        </div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.6.0/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        window.__SUPABASE_URL = '{{ supabase_url }}';
        window.__SUPABASE_KEY = '{{ supabase_key }}';
    </script>
    <script src="/static/js/shared.js"></script>
    <script src="/static/js/bankroll.js"></script>
    <script src="/static/js/poker.js"></script>
</body>
</html>
