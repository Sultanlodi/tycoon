<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Hub - Sign In</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" type="image/png" href="/static/favicon.png">
</head>
<body>
    <div id="app">
        <div class="screen active">
            <div class="container auth-container">
                <h1 class="picker-logo">GAME HUB</h1>
                <p class="subtitle">Sign In to Play</p>

                <div class="auth-tabs">
                    <button class="auth-tab active" data-tab="login" onclick="switchAuthTab('login')">Log In</button>
                    <button class="auth-tab" data-tab="signup" onclick="switchAuthTab('signup')">Sign Up</button>
                </div>

                <div id="auth-error" class="auth-error" style="display:none;"></div>

                <!-- Login Form -->
                <form id="login-form" class="auth-form" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="login-email" placeholder="your@email.com" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="login-password" placeholder="Enter password" minlength="6" required>
                    </div>
                    <button type="submit" class="btn-primary auth-submit-btn" id="login-btn">Log In</button>
                </form>

                <!-- Signup Form -->
                <form id="signup-form" class="auth-form" style="display:none;" onsubmit="handleSignUp(event)">
                    <div class="form-group">
                        <label>Display Name</label>
                        <input type="text" id="signup-name" placeholder="Your name" maxlength="15" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="signup-email" placeholder="your@email.com" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="signup-password" placeholder="Min 6 characters" minlength="6" required>
                    </div>
                    <button type="submit" class="btn-primary auth-submit-btn" id="signup-btn">Create Account</button>
                </form>

                <a href="/" class="auth-back-link">Back to Game Hub</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        window.__SUPABASE_URL = '{{ supabase_url }}';
        window.__SUPABASE_KEY = '{{ supabase_key }}';
    </script>
    <script src="/static/js/auth.js"></script>
</body>
</html>
